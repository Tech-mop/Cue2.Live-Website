<footer>
  <div class="container">
    <p>
      <a href="{% if site.active_lang == site.default_lang %}/{% else %}/{{ site.active_lang }}/{% endif %}">{% t nav.home %}</a>
      · <a href="{% if site.active_lang == site.default_lang %}/about/{% else %}/{{ site.active_lang }}/about/{% endif %}">{% t nav.about %}</a>
      · <a href="https://docs.cue2.live">{% t nav.documentation %}</a>
      · <a href="https://github.com/Tech-mop/Cue2">{% t nav.github %}</a>
    </p>
    {%- if site.x_handle %}
    <p class="footer-social">
      <a class="social-link" href="https://x.com/{{ site.x_handle }}" target="_blank" rel="noopener" aria-label="{% t footer.x_label %}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </p>
    {%- endif %}
    <p>{% t footer.copyright_before %} <a href="https://github.com/Tech-mop/Cue2.Live-Website">GitHub</a>{% t footer.copyright_after %}</p>
  </div>
</footer>
