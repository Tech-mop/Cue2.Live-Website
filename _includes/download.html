{% assign release = site.cue2_release %}

<section class="download" id="download" aria-label="{% t download.aria %}"
         data-release-api="https://api.github.com/repos/Tech-mop/Cue2/releases/latest">
  <a class="download-btn" id="download-primary"
     href="{{ release.assets.windows_x86_64 }}"
     data-platform="windows-x86_64">
    <span class="download-label">{% t download.windows %}</span>
    <span class="download-meta">{{ release.tag }} · x64 · zip</span>
  </a>

  <ul class="download-others" id="download-others">
    <li hidden>
      <a data-platform="windows-x86_64"
         data-label="{% t download.windows %}"
         data-detail="x64 · zip"
         data-meta="{{ release.tag }} · x64 · zip"
         href="{{ release.assets.windows_x86_64 }}">{% t download.windows_x64 %}</a>
    </li>
    <li>
      <a data-platform="windows-arm64"
         data-label="{% t download.windows %}"
         data-detail="ARM64 · zip"
         data-meta="{{ release.tag }} · ARM64 · zip"
         href="{{ release.assets.windows_arm64 }}">{% t download.windows_arm64 %}</a>
    </li>
    <li>
      <a data-platform="macos-arm64"
         data-label="{% t download.macos %}"
         data-detail="Apple Silicon · zip"
         data-meta="{{ release.tag }} · Apple Silicon · zip"
         href="{{ release.assets.macos_arm64 }}">{% t download.macos_arm64 %}</a>
    </li>
    <li>
      <a data-platform="linux-x86_64"
         data-label="{% t download.linux %}"
         data-detail="x64 · tar.gz"
         data-meta="{{ release.tag }} · x64 · tar.gz"
         href="{{ release.assets.linux_x86_64 }}">{% t download.linux_x64 %}</a>
    </li>
    <li>
      <a data-platform="linux-arm64"
         data-label="{% t download.linux %}"
         data-detail="ARM64 · tar.gz"
         data-meta="{{ release.tag }} · ARM64 · tar.gz"
         href="{{ release.assets.linux_arm64 }}">{% t download.linux_arm64 %}</a>
    </li>
  </ul>

  <p class="download-releases">
    <a href="{{ release.page }}">{% t download.all_releases %}</a>
  </p>
</section>
<script src="{{ '/assets/js/download.js' | relative_url }}"></script>
