home:
  title: "Cue2 — ओपन-सोर्स लाइव मीडिया प्लेबैक और शो नियंत्रण"
  description: "Cue2 लाइव इवेंट के लिए मुफ़्त, ओपन-सोर्स क्यू-आधारित प्लेबैक है। Windows, macOS और Linux पर क्यूलिस्ट से ऑडियो, वीडियो, टेक्स्ट, OSC और MIDI चलाएँ।"
  hero_h1: "लाइव इवेंट के लिए ओपन-सोर्स मीडिया प्लेबैक"
  hero_lede: "Windows, macOS और Linux पर क्यूलिस्ट से ऑडियो, वीडियो, टेक्स्ट, OSC और MIDI चलाने वाला हल्का, बहुउपयोगी ऐप।"
  screenshot_alt: "Cue2 0.1 थिएटर क्यूलिस्ट, सक्रिय क्यू और ऑडियो वेवफ़ॉर्म दिखाता हुआ"
  release_note: "Cue2 <strong>0.1.0 StripyHat</strong> पहला सार्वजनिक अल्फा है। अपने OS का आर्काइव डाउनलोड करें, खोलें, और Cue2 चलाएँ। विश्वसनीयता पर काफ़ी ध्यान दिया गया है, फिर भी अल्फा सॉफ़्टवेयर की तरह सावधानी से इस्तेमाल करें।"
  about_h2: "Cue2 के बारे में"
  about_p1: "Cue2 <strong>ऑडियो, वीडियो, टेक्स्ट ओवरले और शो-कंट्रोल संदेशों के अनुक्रमित प्लेबैक</strong> के लिए एक डेस्कटॉप ऐप है। क्यू में शेल और कंपोनेंट होते हैं। शेल प्लेबैक निर्देश हैं। कंपोनेंट वे क्रियाएँ हैं जो क्यू करेगा। क्यूलिस्ट ढीली संरचना वाली है: किसी भी क्यू को दूसरी क्यू का चाइल्ड बनाकर साथ चलाया जा सकता है। जटिल सीक्वेंस भी प्रोग्राम करना आसान रहता है।"
  about_p2: "Cue2 दुनिया भर की सामुदायिक प्रदर्शन कला के लिए प्यार से बना है। और भी कई जगहों पर, और किसी भी वर्कफ़्लो में जहाँ मीडिया और नेटवर्क कमांड विश्वसनीय रूप से ट्रिगर हों, इसका उपयोग हो सकता है। डिकोड <strong>FFmpeg</strong> से होता है, इसलिए कई फ़ॉर्मैट चलते हैं। ऑडियो I/O <strong>SDL3</strong> है। ऐप <strong>MIT-लाइसेंस</strong> है — उपयोग, बदलाव और पुनर्वितरण मुक्त है।"
  features_h2: "आप क्या कर सकते हैं"
  feature_audio_h3: "ऑडियो प्लेबैक"
  feature_audio_p: "क्यूलिस्ट से साउंड फ़ाइलें चलाएँ — पैच, प्रति-क्यू राउटिंग मैट्रिक्स, लेवल, पैन और फ़ेड के साथ।"
  feature_audio_link: "शून्य से ऑडियो तक"
  feature_video_h3: "वीडियो और डिस्प्ले"
  feature_video_p: "मल्टी-स्क्रीन कैनवस पर लेयर के साथ फ़िल्में, स्टिल और टेक्स्ट रखें।"
  feature_video_link: "शून्य से वीडियो तक"
  feature_show_h3: "शो नियंत्रण"
  feature_show_p: "OSC और MIDI सुनें और भेजें। नेटवर्क से Cue2 चलाएँ, या क्यू से दूसरे डिवाइस फायर करें। क्यू लाइट बॉक्स में शामिल हैं।"
  feature_show_link: "OSC कमांड संदर्भ"
  feature_seq_h3: "सीक्वेंस और ग्रुप"
  feature_seq_p: "प्री-वेट, पोस्ट-वेट, Continue, Follow, नेस्टेड ग्रुप, और एक प्लेहेड जिसे ऑपरेटर पहले से समझते हैं।"
  feature_seq_link: "क्यू सीक्वेंस"
  feature_cross_h3: "क्रॉस-प्लेटफ़ॉर्म"
  feature_cross_p: "Windows 10+, macOS, और Linux — जहाँ हम बिल्ड देते हैं वहाँ x64 और ARM सहित।"
  feature_cross_link: "सिस्टम आवश्यकताएँ"
  feature_oss_h3: "ओपन सोर्स"
  feature_oss_p: "कोड पढ़ें, इश्यू दर्ज करें, स्रोत से बिल्ड करें। कोई लाइसेंस कुंजी नहीं।"
  feature_oss_link: "लाइसेंसिंग"
  who_h2: "यह किसके लिए है"
  who_p1: "साउंड, वीडियो और शो-कंट्रोल ऑपरेटर जो अपनी मौजूदा मशीन पर क्यूलिस्ट चाहते हैं। आम उपयोग: थिएटर और लाइव प्रदर्शन, कॉन्सर्ट, गैलरी और इंस्टॉलेशन, पूजा स्थल। अगर आप क्यू, GO और स्टैंडबाय में सोचते हैं, तो Cue2 आपके लिए है।"
  who_p2: "Cue2 कई अनुवादों का परीक्षण कर रहा है। हर रिलीज़ में कवरेज और सटीकता सुधरेगी। वर्तमान भाषाएँ: English, Te reo Māori, Español, Deutsch, Русский, 日本語, العربية, हिन्दी."
  start_h2: "शुरू करें"
  start_install: "इंस्टॉल और पहला लॉन्च"
  start_concepts: "पाँच मिनट में अवधारणाएँ"
  start_audio: "अपनी पहली ऑडियो फ़ाइल चलाएँ"
  start_osc: "OSC कमांड संदर्भ"
  start_manual: "पूरी मैनुअल यहाँ है"
