home:
  title: "Cue2 — تشغيل وسائط حيّة مفتوح المصدر وتحكم بالعرض"
  description: "Cue2 تشغيل مجاني ومفتوح المصدر قائم على الإشارات للفعاليات الحية. شغّل الصوت والفيديو والنص وOSC وMIDI من قائمة إشارات على Windows وmacOS وLinux."
  hero_h1: "تشغيل وسائط مفتوح المصدر للفعاليات الحية"
  hero_lede: "تطبيق خفيف ومتعدد الاستخدامات لتشغيل الصوت والفيديو والنص وOSC وMIDI من قائمة إشارات على Windows وmacOS وLinux."
  screenshot_alt: "Cue2 0.1 يعرض قائمة إشارات مسرحية وإشارات نشطة وموجة صوت"
  release_note: "Cue2 <strong>0.1.0 StripyHat</strong> هي أول ألفا عامة. نزّل الأرشيف لنظامك، فكّه، وشغّل Cue2. بُذل جهد كبير لجعله موثوقاً، لكن تعامل معه بحذر يليق ببرمجيات ألفا."
  about_h2: "حول Cue2"
  about_p1: "Cue2 تطبيق سطح مكتب لـ<strong>تشغيل متسلسل للصوت والفيديو وطبقات النص ورسائل تحكم العرض</strong>. تتكون الإشارة من غلاف ومكوّنات. الغلاف تعليمات التشغيل. المكوّنات هي أفعال الإشارة. قائمة الإشارات مرنة: يمكن جعل أي إشارة ابناً لأخرى لتعمل معاً. يتيح ذلك تراكيب تسلسل معقّدة مع بقاء البرمجة سهلة."
  about_p2: "صُنع Cue2 بحب لفنون الأداء المجتمعية حول العالم. ويمكن استخدامه في سياقات كثيرة أخرى، وفي أي سير عمل يحتاج إطلاقاً موثوقاً للوسائط وأوامر الشبكة. فكّ الوسائط عبر <strong>FFmpeg</strong> يدعم نطاقاً واسعاً من الصيغ. دخل/خرج الصوت عبر <strong>SDL3</strong>. التطبيق بـ<strong>رخصة MIT</strong> ومجاني للاستخدام والتعديل وإعادة التوزيع."
  features_h2: "ما يمكنك فعله"
  feature_audio_h3: "تشغيل الصوت"
  feature_audio_p: "شغّل ملفات الصوت من قائمة الإشارات مع باتشات ومصفوفة توجيه لكل إشارة ومستويات وبان وفيد."
  feature_audio_link: "من الصفر إلى الصوت"
  feature_video_h3: "الفيديو والشاشات"
  feature_video_p: "ضع أفلاماً وصوراً ونصاً على لوحة متعددة الشاشات بطبقات."
  feature_video_link: "من الصفر إلى الفيديو"
  feature_show_h3: "تحكم العرض"
  feature_show_p: "استمع وأرسل OSC وMIDI. شغّل Cue2 من الشبكة، أو أطلق أجهزة أخرى من إشارة. أضواء الإشارات مضمّنة."
  feature_show_link: "مرجع أوامر OSC"
  feature_seq_h3: "التسلسلات والمجموعات"
  feature_seq_p: "انتظار مسبق ولاحق، Continue وFollow، مجموعات متداخلة، ورأس تشغيل يفهمه المشغّلون مسبقاً."
  feature_seq_link: "تسلسلات الإشارات"
  feature_cross_h3: "متعدد المنصات"
  feature_cross_p: "Windows 10+ وmacOS وLinux، بما في ذلك x64 وARM حيث نوفّر بناءات."
  feature_cross_link: "متطلبات النظام"
  feature_oss_h3: "مفتوح المصدر"
  feature_oss_p: "اقرأ الشفرة، سجّل المشاكل، وابنِ من المصدر. بلا مفتاح ترخيص."
  feature_oss_link: "الترخيص"
  who_h2: "لمن هو"
  who_p1: "مشغّلو الصوت والفيديو وتحكم العرض الذين يريدون قائمة إشارات على الجهاز لديهم أصلاً. الاستخدامات الشائعة: المسرح والأداء الحي، الحفلات، المعارض والتجهيزات، ودور العبادة. إن كنت تفكّر بإشارات وGO واستعداد، فـ Cue2 موجّه لك."
  who_p2: "يختبر Cue2 حالياً ترجمات متعددة. مع كل إصدار نحسّن التغطية والدقة. اللغات المدعومة حالياً: English, Te reo Māori, Español, Deutsch, Русский, 日本語, العربية, हिन्दी."
  start_h2: "ابدأ"
  start_install: "التثبيت والإطلاق الأول"
  start_concepts: "المفاهيم في خمس دقائق"
  start_audio: "شغّل أول ملف صوت"
  start_osc: "مرجع أوامر OSC"
  start_manual: "الدليل الكامل على"
