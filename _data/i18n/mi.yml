home:
  title: "Cue2 — Purei pāpāho ora pūmana me te whakahaere whakaaturanga"
  description: "He pūmana, he kore utu a Cue2 mō te purei tohu i ngā kaupapa ora. Whakahaerea te oro, ataata, kupu, OSC me te MIDI i tētahi rārangi tohu i Windows, macOS me Linux."
  hero_h1: "Purei pāpāho pūmana mō ngā kaupapa ora"
  hero_lede: "He taupānga māmā, whaikiko hoki hei whakahaere oro, ataata, kupu, OSC me te MIDI i tētahi rārangi tohu i Windows, macOS me Linux."
  screenshot_alt: "Cue2 0.1 e whakaatu ana i tētahi rārangi tohu whare tapere, ngā tohu hohe, me tētahi ngaru oro"
  release_note: "Ko Cue2 <strong>0.1.0 StripyHat</strong> te arpha tūmatanui tuatahi. Tikiakehia te pūranga mō tō pūnaha, wewetehia, ka whakahaere i a Cue2. Kua nui te atawhai kia pono, engari me āta whakamahi tonu nā te mea he pūmana arpha."
  about_h2: "Mō Cue2"
  about_p1: "He taupānga rorohiko a Cue2 mō te <strong>purei raupapa o te oro, ataata, kupu takatika, me ngā karere whakahaere whakaaturanga</strong>. He anga me ngā waehanga ō ngā tohu. Ko te anga ngā tohutohu purei. Ko ngā waehanga ngā mahi a te tohu. He hanganga ngāwari te rārangi tohu: ka taea te whakamōtū i tētahi tohu hei tamaiti nō tētahi atu, kia purei ngātahi. He raupapa uaua, he māmā tonu te papatono."
  about_p2: "I hangaia a Cue2 ki te aroha mō ngā mahi whakaari hapori o te ao. Engari ka taea hoki i ētahi atu wāhi, i ngā mahi rānei e hiahia ana ki te pūrena pono o te pāpāho me ngā whakahau whatunga. Ka whakamahi te wetewete pāpāho i a <strong>FFmpeg</strong>, he maha ngā hōputu. Ko <strong>SDL3</strong> te I/O oro. He raihana <strong>MIT</strong> te taupānga — wātea te whakamahi, te whakarerekē, te tohatoha."
  features_h2: "Ngā mahi ka taea"
  feature_audio_h3: "Purei oro"
  feature_audio_p: "Pureia ngā kōnae oro i te rārangi tohu, me ngā pātene, he mātiti ararere ia tohu, ngā taumata, te pan, me ngā memeha."
  feature_audio_link: "Kore ki te oro"
  feature_video_h3: "Ataata me ngā whakaatu"
  feature_video_p: "Whakanohoia ngā kiriata, pikitia, me ngā kupu ki tētahi kānawe mata-maha, me ngā paparanga."
  feature_video_link: "Kore ki te ataata"
  feature_show_h3: "Whakahaere whakaaturanga"
  feature_show_p: "Whakarongo, tuku OSC me te MIDI. Whakahaerea a Cue2 i te whatunga, tūwhera rānei ētahi atu pūrere i tētahi tohu. Kei roto ngā rama tohu."
  feature_show_link: "Tohutoro whakahau OSC"
  feature_seq_h3: "Raupapa me ngā rōpū"
  feature_seq_p: "Tataritanga-mua, tataritanga-muri, Haere tonu, Whai, ngā rōpū kōpūpū, me te upoko-purei e mōhio kē ana ngā kaiwhakahaere."
  feature_seq_link: "Raupapa tohu"
  feature_cross_h3: "Tū-papa-maha"
  feature_cross_p: "Windows 10+, macOS, me Linux, tae atu ki te x64 me te ARM kei reira ngā hanga."
  feature_cross_link: "Ngā whakaritenga pūnaha"
  feature_oss_h3: "Pūmana"
  feature_oss_p: "Pānuitia te waehere, tukuna ngā take, hangaia mai i te pūtake. Kāore he kī raihana."
  feature_oss_link: "Raihana"
  who_h2: "Mō wai"
  who_p1: "Ngā kaiwhakahaere oro, ataata, whakahaere-whakaaturanga e hiahia ana ki tētahi rārangi tohu i te rorohiko kei a rātou kē. Ko ngā whare tapere, ngā whakaaturanga ora, ngā konohete, ngā taiwhanga, ngā whare karakia. Mēnā ko ngā tohu, te GO, me te tū rite ōu whakaaro, mōu a Cue2."
  who_p2: "Kei te whakamātau a Cue2 i ētahi whakamāoritanga. Ia putanga ka pai ake te kapi me te tika. Ngā reo ināianei: English, Te reo Māori, Español, Deutsch, Русский, 日本語, العربية, हिन्दी."
  start_h2: "Tīmata"
  start_install: "Tāuta me te whakarewa tuatahi"
  start_concepts: "Ngā ariā i te rima meneti"
  start_audio: "Pureia tō kōnae oro tuatahi"
  start_osc: "Tohutoro whakahau OSC"
  start_manual: "Kei konei te pukapuka katoa"
about:
  title: "Mō Cue2"
  description: "He pūmana raihana MIT a Cue2 nā Samuel Moxham, mō te whakahaere whakaaturanga me te purei pāpāho. Ko 0.1 StripyHat te arpha tūmatanui tuatahi."
  h1: "Mō Cue2"
  intro: "He pūmana, he kore utu a Cue2 mō te purei tohu o te oro, ataata, kupu takatika, me ngā karere whakahaere whakaaturanga. Ka rere i Windows, macOS, me Linux."
  project_h2: "Kaupapa"
  project_p: "Nā <strong>Samuel Moxham</strong> a Cue2 i tuhi, i tiaki. Ko <strong>0.1.0 StripyHat</strong> te arpha tūmatanui tuatahi, i 2026. Kei te whanake tonu. Kua nui te mahi kia pono, engari me āta whakamahi nā te mea he arpha."
  license_h2: "Raihana"
  license_p1: "Ka tukuna te waehere Cue2 i raro i te Raihana MIT. Wātea koe ki te whakamahi, whakarerekē, tohatoha i runga i aua tikanga. Ka tukuna te pūmana i a ia, kāore he taunaki."
  license_p2: "Ka tohatohatia ngā pūmanawa FFmpeg i raro i te LGPLv2.1, i muri mai rānei. Ko RtMidi (ahu MIT) te MIDI. Kei ngā"
  license_link: "tuhipoka raihana"
