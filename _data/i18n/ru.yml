  about_h2: "О Cue2"
  about_p1: "Cue2 — настольное приложение для запуска медиа в живом шоу. Вы составляете <strong>cuelist</strong> — упорядоченный список cue для звука, видео, текста и управления шоу. Во время спектакля вы нажимаете <strong>GO</strong>, и Cue2 воспроизводит следующую cue точно так, как вы её запрограммировали. Cue можно группировать, чтобы одно нажатие GO запускало сразу несколько действий, — так даже сложные последовательности остаются простыми в работе."
  about_p2: "Cue2 сделан с любовью к любительскому сценическому искусству по всему миру. Его можно применять и в других местах — везде, где нужно надёжно запускать медиа и сетевые команды. Декодирование через <strong>FFmpeg</strong> даёт широкий набор форматов. Аудио I/O — <strong>SDL3</strong>. Приложение под <strong>лицензией MIT</strong>: можно использовать, менять и распространять."
  features_h2: "Что можно делать"
  feature_audio_h3: "Воспроизведение аудио"
  feature_audio_p: "Воспроизводите звуковые файлы из cuelist: патчи, матрица маршрутизации на cue, уровни, панорама и фейды."
  feature_audio_link: "С нуля до аудио"
  feature_video_h3: "Видео и экраны"
  feature_video_p: "Фильмы, кадры и текст на многоэкранном холсте со слоями."
  feature_video_link: "С нуля до видео"
  feature_show_h3: "Управление шоу"
  feature_show_p: "Приём и отправка OSC и MIDI. Управляйте Cue2 по сети или запускайте другие устройства из cue. Cue-lights уже в комплекте."
  feature_show_link: "Справка по командам OSC"
  feature_seq_h3: "Последовательности и группы"
  feature_seq_p: "Pre-wait, post-wait, Continue, Follow, вложенные группы и playhead, который операторы уже понимают."
  feature_seq_link: "Последовательности cue"
  feature_cross_h3: "Кроссплатформенность"
  feature_cross_p: "Windows 10 и новее, macOS на Apple Silicon и Linux, со сборками x64 и ARM там, где они есть."
  feature_cross_link: "Системные требования"
  feature_oss_h3: "Открытый исходный код"
  feature_oss_p: "Читайте код, открывайте задачи, собирайте из исходников. Без лицензионного ключа."
  feature_oss_link: "Лицензии"
  who_h2: "Для кого"
  who_p1: "Звукорежиссёры, видеооператоры и show-control, которым нужен cuelist на уже имеющейся машине. Типичные места: театр и живое выступление, концерты, галереи и инсталляции, храмы. Если вы мыслите cues, GO и standby — Cue2 для вас."
