home:
  title: "Cue2 — Open-Source-Live-Medienwiedergabe und Showsteuerung"
  description: "Cue2 ist kostenlose, quelloffene cue-basierte Wiedergabe für Live-Events. Audio, Video, Text, OSC und MIDI aus einer Cuelist auf Windows, macOS und Linux."
  hero_h1: "Open-Source-Medienwiedergabe für Live-Events"
  hero_lede: "Eine schlanke, vielseitige App für Audio, Video, Text, OSC und MIDI aus einer Cuelist auf Windows, macOS und Linux."
  screenshot_alt: "Cue2 0.1 mit einer Theater-Cuelist, aktiven Cues und einer Audio-Wellenform"
  release_note: "Cue2 <strong>0.1.0 StripyHat</strong> ist die erste öffentliche Alpha. Laden Sie das Archiv für Ihr Betriebssystem herunter, entpacken Sie es und starten Sie Cue2. Es wurde mit viel Sorgfalt zuverlässig gemacht, bleibt aber Alpha-Software — entsprechend vorsichtig einsetzen."
  about_h2: "Über Cue2"
  about_p1: "Cue2 ist eine Desktop-Anwendung für <strong>sequenzielle Wiedergabe von Audio, Video, Text-Overlays und Show-Control-Nachrichten</strong>. Cues bestehen aus einer Hülle und Komponenten. Die Hülle sind die Wiedergabeanweisungen. Die Komponenten sind die Aktionen der Cue. Die Cuelist ist locker strukturiert: Jede Cue kann nach Belieben Kind einer anderen sein und gemeinsam abgespielt werden. So entstehen komplexe Abläufe, die sich trotzdem leicht programmieren lassen."
  about_p2: "Cue2 entstand aus Liebe zur darstellenden Community-Kunst weltweit. Es eignet sich aber auch für viele andere Kontexte und jeden Ablauf, der zuverlässiges Auslösen von Medien und Netzwerkbefehlen braucht. Die Dekodierung nutzt <strong>FFmpeg</strong> und damit viele Formate. Audio-I/O nutzt <strong>SDL3</strong>. Die Anwendung steht unter der <strong>MIT-Lizenz</strong> — nutzen, ändern, weitergeben."
  features_h2: "Was Sie tun können"
  feature_audio_h3: "Audiowiedergabe"
  feature_audio_p: "Spielen Sie Tondateien aus der Cuelist mit Patches, einer Routing-Matrix pro Cue, Pegeln, Pan und Fades."
  feature_audio_link: "Von null zu Audio"
  feature_video_h3: "Video und Displays"
  feature_video_p: "Filme, Standbilder und Text auf einer Mehrschirm-Leinwand mit Ebenen."
  feature_video_link: "Von null zu Video"
  feature_show_h3: "Showsteuerung"
  feature_show_p: "OSC und MIDI empfangen und senden. Cue2 übers Netzwerk steuern oder andere Geräte aus einer Cue feuern. Cue-Lights sind dabei."
  feature_show_link: "OSC-Befehlsreferenz"
  feature_seq_h3: "Sequenzen und Gruppen"
  feature_seq_p: "Pre-Wait, Post-Wait, Continue, Follow, verschachtelte Gruppen und ein Playhead, den Operatoren schon kennen."
  feature_seq_link: "Cue-Sequenzen"
  feature_cross_h3: "Plattformübergreifend"
  feature_cross_p: "Windows 10+, macOS und Linux, inklusive x64 und ARM, wo wir Builds ausliefern."
  feature_cross_link: "Systemanforderungen"
  feature_oss_h3: "Open Source"
  feature_oss_p: "Code lesen, Issues öffnen, aus dem Quellcode bauen. Kein Lizenzschlüssel."
  feature_oss_link: "Lizenzierung"
  who_h2: "Für wen"
  who_p1: "Ton-, Video- und Showsteuerungs-Operatoren, die eine Cuelist auf dem Rechner haben wollen, den sie schon haben. Typisch: Theater und Live-Performance, Konzerte, Galerien und Installationen, Gotteshäuser. Wer in Cues, GO und Standby denkt, ist die Zielgruppe."
  who_p2: "Cue2 testet derzeit mehrere Übersetzungen. Mit jeder Version werden Abdeckung und Genauigkeit besser. Derzeit unterstützt: English, Te reo Māori, Español, Deutsch, Русский, 日本語, العربية, हिन्दी."
  start_h2: "Loslegen"
  start_install: "Installation und erster Start"
  start_concepts: "Konzepte in fünf Minuten"
  start_audio: "Erste Audiodatei abspielen"
  start_osc: "OSC-Befehlsreferenz"
  start_manual: "Das vollständige Handbuch steht unter"
