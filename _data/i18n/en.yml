home:
  title: "Cue2 — Open-source live media playback and show control"
  description: "Cue2 is free, open-source cue-based playback for live events. Run audio, video, text, OSC and MIDI from a cuelist on Windows, macOS and Linux."
  hero_h1: "Open-source media playback for live events"
  hero_lede: "A lightweight and versatile app to run audio, video, text, OSC and MIDI from a cuelist on Windows, macOS and Linux."
  hero_badge: "Free and open source · Public alpha"
  screenshot_alt: "Cue2 showing a theatre cuelist, active cues, and an audio waveform"
  release_note: "The current release is Cue2 <strong>{release}</strong>, a public alpha. Download the archive for your OS, unpack it, and run Cue2. A great deal of care has gone into making it reliable, but you should still treat it with the caution appropriate to alpha software."
  about_h2: "About Cue2"
  about_p1: "Cue2 is a desktop app for running the media in a live show. You build a <strong>cuelist</strong>: an ordered list of sound, video, text and show-control cues. During the show you press <strong>GO</strong> and Cue2 plays the next cue exactly as you programmed it. Cues can be grouped so one GO starts several things at once, which keeps even complex sequences easy to run."
  about_p2: "Cue2 was made with love for community performing arts around the world. But it can also be used in many more settings, and in any workflow that needs reliable triggering of media and network commands. Media decode uses <strong>FFmpeg</strong>, allowing a wide range of supported formats. Audio I/O uses <strong>SDL3</strong>. The application is <strong>MIT-licensed</strong> and free to use, modify, and redistribute."
  features_h2: "What you can do"
  feature_audio_h3: "Audio playback"
  feature_audio_p: "Play sound files from the cuelist with patches, a per-cue routing matrix, levels, pan, and fades."
  feature_audio_link: "Zero to audio"
  feature_video_h3: "Video and displays"
  feature_video_p: "Put movies, stills, and text on a multi-screen canvas with layers."
  feature_video_link: "Zero to video"
  feature_show_h3: "Show control"
  feature_show_p: "Listen and send OSC and MIDI. Drive Cue2 from the network, or fire other devices from a cue. Cue lights are in the box."
  feature_show_link: "OSC command reference"
  feature_seq_h3: "Sequences and groups"
  feature_seq_p: "Pre-wait, post-wait, Continue, Follow, nested groups, and a playhead that operators already understand."
  feature_seq_link: "Cue sequences"
  feature_cross_h3: "Cross-platform"
  feature_cross_p: "Windows 10 or later, macOS on Apple Silicon, and Linux, with x64 and ARM builds where we ship them."
  feature_cross_link: "System requirements"
  feature_oss_h3: "Open source"
  feature_oss_p: "Read the code, file issues, and build from source. No license key."
  feature_oss_link: "Licensing"
  who_h2: "Who it is for"
  who_p1: "Sound, video, and show-control operators who want a cuelist on the machine they already have. Typical uses are theatre and live performance, concerts, galleries and installations, and houses of worship. If you think in cues, GO, and standby, Cue2 is aimed at you."
