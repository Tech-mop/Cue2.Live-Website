home:
  title: "Cue2 — Reproducción de medios en vivo y control de espectáculo de código abierto"
  description: "Cue2 es reproducción gratuita y de código abierto basada en cues para eventos en vivo. Audio, vídeo, texto, OSC y MIDI desde una cuelist en Windows, macOS y Linux."
  hero_h1: "Reproducción de medios de código abierto para eventos en vivo"
  hero_lede: "Una app ligera y versátil para reproducir audio, vídeo, texto, OSC y MIDI desde una cuelist en Windows, macOS y Linux."
  screenshot_alt: "Cue2 0.1 mostrando una cuelist de teatro, cues activas y una forma de onda de audio"
  release_note: "Cue2 <strong>0.1.0 StripyHat</strong> es la primera alfa pública. Descarga el archivo para tu sistema, descomprímelo y ejecuta Cue2. Se ha cuidado mucho la fiabilidad, pero trátalo con la cautela propia de un software alfa."
  about_h2: "Acerca de Cue2"
  about_p1: "Cue2 es una aplicación de escritorio para <strong>reproducción secuenciada de audio, vídeo, superposiciones de texto y mensajes de control de espectáculo</strong>. Las cues tienen una cáscara y componentes. La cáscara son las instrucciones de reproducción. Los componentes son las acciones de la cue. La cuelist es flexible: cualquier cue puede ser hija de otra y reproducirse juntas. Así se arman secuencias complejas sin dejar de ser fáciles de programar."
  about_p2: "Cue2 nació con cariño por las artes escénicas comunitarias de todo el mundo. También sirve en muchos otros contextos y en cualquier flujo que necesite disparar medios y comandos de red con fiabilidad. La decodificación usa <strong>FFmpeg</strong>, con una amplia gama de formatos. El I/O de audio usa <strong>SDL3</strong>. La aplicación tiene <strong>licencia MIT</strong>: úsala, modifícala y redistribúyela."
  features_h2: "Qué puedes hacer"
  feature_audio_h3: "Reproducción de audio"
  feature_audio_p: "Reproduce archivos de sonido desde la cuelist con parches, una matriz de enrutado por cue, niveles, paneo y fundidos."
  feature_audio_link: "De cero a audio"
  feature_video_h3: "Vídeo y pantallas"
  feature_video_p: "Pon películas, imágenes y texto en un lienzo multi-pantalla con capas."
  feature_video_link: "De cero a vídeo"
  feature_show_h3: "Control de espectáculo"
  feature_show_p: "Escucha y envía OSC y MIDI. Controla Cue2 por red o dispara otros dispositivos desde una cue. Las cue lights van incluidas."
  feature_show_link: "Referencia de comandos OSC"
  feature_seq_h3: "Secuencias y grupos"
  feature_seq_p: "Preespera, postespera, Continue, Follow, grupos anidados y un playhead que los operadores ya entienden."
  feature_seq_link: "Secuencias de cues"
  feature_cross_h3: "Multiplataforma"
  feature_cross_p: "Windows 10+, macOS y Linux, incluyendo x64 y ARM donde publicamos builds."
  feature_cross_link: "Requisitos del sistema"
  feature_oss_h3: "Código abierto"
  feature_oss_p: "Lee el código, abre incidencias y compila desde el origen. Sin clave de licencia."
  feature_oss_link: "Licencias"
  who_h2: "Para quién es"
  who_p1: "Operadores de sonido, vídeo y control de espectáculo que quieren una cuelist en la máquina que ya tienen. Usos típicos: teatro y directo, conciertos, galerías e instalaciones, y lugares de culto. Si piensas en cues, GO y standby, Cue2 va dirigido a ti."
  who_p2: "Cue2 está probando varias traducciones. Con cada versión mejoraremos cobertura y precisión. Idiomas actuales: English, Te reo Māori, Español, Deutsch, Русский, 日本語, العربية, हिन्दी."
  start_h2: "Empezar"
  start_install: "Instalación y primer arranque"
  start_concepts: "Conceptos en cinco minutos"
  start_audio: "Reproduce tu primer archivo de audio"
  start_osc: "Referencia de comandos OSC"
  start_manual: "El manual completo está en"
