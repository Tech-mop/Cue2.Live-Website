home:
  title: "Cue2 — オープンソースのライブメディア再生とショーコントロール"
  description: "Cue2 はライブイベント向けの無料オープンソースのキュー再生です。Windows、macOS、Linux のキューリストから音声、映像、テキスト、OSC、MIDI を実行します。"
  hero_h1: "ライブイベント向けオープンソースメディア再生"
  hero_lede: "Windows、macOS、Linux のキューリストから音声、映像、テキスト、OSC、MIDI を実行する、軽量で汎用的なアプリです。"
  hero_badge: "無料・オープンソース · 公開アルファ"
  screenshot_alt: "劇場のキューリスト、アクティブなキュー、音声波形を示す Cue2"
  release_note: "現在のリリースは Cue2 <strong>{release}</strong>（公開アルファ）です。お使いの OS 用アーカイブをダウンロードし、展開して Cue2 を実行してください。信頼性には十分配慮していますが、アルファ版として慎重に扱ってください。"
  about_h2: "Cue2 について"
  about_p1: "Cue2 はライブショーのメディアを操作するためのデスクトップアプリです。音響、映像、テキスト、ショーコントロールのキューを順番に並べた<strong>キューリスト</strong>を作り、本番では <strong>GO</strong> を押すだけで、次のキューがプログラムどおりに再生されます。キューはグループ化でき、1 回の GO で複数の動作を同時に開始できるので、複雑なシーケンスも簡単に運用できます。"
  about_p2: "Cue2 は世界のコミュニティ舞台芸術への愛から生まれました。メディアとネットワークコマンドを確実にトリガーしたい、ほかの現場やワークフローでも使えます。デコードは <strong>FFmpeg</strong> で、多くの形式に対応します。音声 I/O は <strong>SDL3</strong>。アプリは <strong>MIT ライセンス</strong>で、利用・改変・再配布が自由です。"
  features_h2: "できること"
  feature_audio_h3: "音声再生"
  feature_audio_p: "キューリストから音声ファイルを再生。パッチ、キューごとのルーティングマトリクス、レベル、パン、フェードに対応。"
  feature_audio_link: "ゼロから音声へ"
  feature_video_h3: "映像とディスプレイ"
  feature_video_p: "複数画面キャンバスのレイヤーに動画、静止画、テキストを出せます。"
  feature_video_link: "ゼロから映像へ"
  feature_show_h3: "ショーコントロール"
  feature_show_p: "OSC と MIDI の受信・送信。ネットワークから Cue2 を操作したり、キューから他機器を発火できます。キューライトも同梱です。"
  feature_show_link: "OSC コマンドリファレンス"
  feature_seq_h3: "シーケンスとグループ"
  feature_seq_p: "プリウェイト、ポストウェイト、Continue、Follow、入れ子グループ、オペレーターが既に知っているプレイヘッド。"
  feature_seq_link: "キューシーケンス"
  feature_cross_h3: "クロスプラットフォーム"
  feature_cross_p: "Windows 10 以降、Apple Silicon 搭載の macOS、Linux。x64 と ARM のビルドを提供しています。"
  feature_cross_link: "システム要件"
  feature_oss_h3: "オープンソース"
  feature_oss_p: "コードを読み、Issue を出し、ソースからビルドできます。ライセンスキーは不要です。"
  feature_oss_link: "ライセンス"
  who_h2: "誰向けか"
  who_p1: "すでに持っているマシンでキューリストを使いたい音響・映像・ショーコントロールのオペレーター向け。劇場やライブ、コンサート、ギャラリーやインスタレーション、礼拝堂など。キュー、GO、スタンバイで考える人のための Cue2 です。"
  start_h2: "はじめに"
  start_install: "インストールと初回起動"
  start_concepts: "5分でわかる概念"
