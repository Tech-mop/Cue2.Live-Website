<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(circle at 85% 20%, #2c2420 0%, #1b1b1d 55%);font-family:'Open Sans',Arial,sans-serif;color:#fff;position:relative}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#EB6F02}
.left{position:absolute;left:72px;top:62px;width:520px}
.logo{height:92px;display:block}
h1{font-size:44px;line-height:1.18;margin:36px 0 18px;font-weight:700}
.sub{font-size:23px;color:#cfcfcf;margin:0 0 26px;line-height:1.4}
.badge{display:inline-block;padding:8px 20px;border:2px solid rgba(235,111,2,.7);border-radius:999px;color:#EB6F02;font-weight:700;font-size:21px;background:rgba(235,111,2,.08)}
.shot{position:absolute;left:640px;top:118px;width:620px;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px #333}
.url{margin-top:26px;font-size:22px;color:#EB6F02;font-weight:700;letter-spacing:.02em}
</style></head><body>
<div class="left">
<img class="logo" src="../../assets/img/Cue2Logo.svg">
<h1>Open-source media playback for live events</h1>
<p class="sub">Run audio, video, text, OSC and MIDI from a cuelist on Windows, macOS and Linux.</p>
<span class="badge">Free and open source · Public alpha</span>
<div class="url">www.cue2.live</div>
</div>
<img class="shot" src="../../assets/img/cue2-window.webp">
<div class="bar"></div>
</body></html>
